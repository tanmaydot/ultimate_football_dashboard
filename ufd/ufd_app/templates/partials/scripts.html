<script>
    (function () {
        var KEY = 'ufd.sidebar';
        var body = document.body;

        function setOpen(open, remember) {
            body.classList.toggle('sidebar-open', open);
            if (remember && window.innerWidth >= 1024) {
                try { localStorage.setItem(KEY, open ? 'open' : 'closed'); } catch (e) { /* storage blocked */ }
            }
            // The dashboard grid is percentage based, but let anything listening re-measure after the slide.
            setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 450);
        }

        document.getElementById('sidebarToggle').addEventListener('click', function () { setOpen(true, true); });
        document.getElementById('sidebarClose').addEventListener('click', function () { setOpen(false, true); });
        document.getElementById('sidebarOverlay').addEventListener('click', function () { setOpen(false, false); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && window.innerWidth < 1024) setOpen(false, false);
        });
        // On a phone, choosing a club (or Dashboard) loads a new page, which starts collapsed again.
    })();
</script>
<script>
    // Theme switch (light / dark). head.html has already applied the saved theme; this keeps the buttons in sync and saves changes.
    (function () {
        var root = document.documentElement;
        var BG = { light: '#eceff3', dark: '#000000' };
        function sync() {
            document.querySelectorAll('[data-theme-choice]').forEach(function (b) {
                b.setAttribute('aria-checked', String(b.dataset.themeChoice === root.dataset.theme));
            });
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', BG[root.dataset.theme] || BG.dark);
        }
        document.addEventListener('click', function (e) {
            var theme = e.target.closest('[data-theme-choice]');
            if (!theme) return;
            root.dataset.theme = theme.dataset.themeChoice;
            try { localStorage.setItem('ufd.theme', root.dataset.theme); } catch (err) { /* storage blocked */ }
            sync();
        });
        sync();
    })();
</script>

<script>
    // A whole table row opens that club (the club name is also a real link, for keyboards and middle-click).
    document.addEventListener('click', function (e) {
        var row = e.target.closest('.club-row');
        if (row && !e.target.closest('a')) window.location.href = row.dataset.href;
    });
</script>
