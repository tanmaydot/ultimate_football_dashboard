<style>
    #mobileGate { display: none; }
    @media (max-width: 767px) {
        html:not(.gate-dismissed) #mobileGate { display: flex; }
        html:not(.gate-dismissed) body { overflow: hidden; }
    }
    #mobileGate {
        position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; padding: 24px;
        background: var(--bg); text-align: center;
    }
    #mobileGate .gate-card { max-width: 22rem; padding: 32px 24px; }
    #mobileGate .gate-icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; font-size: 1.9rem; background: var(--accent-soft); color: var(--accent-text); }
</style>
<div id="mobileGate" role="dialog" aria-labelledby="gateTitle">
    <div class="gate-card card">
        <div class="gate-icon"><i class="fas fa-desktop"></i></div>
        <h2 id="gateTitle" class="display text-3xl font-bold leading-tight">Best on a bigger screen</h2>
        <p class="mt-3 text-sm" style="color: var(--muted)">
            This dashboard has draggable widgets, a tactics board and wide tables that need room to breathe.
            Open it on a desktop or laptop for the full experience.
        </p>
        <button type="button" id="gateContinue" class="btn-accent mt-6 w-full text-sm font-semibold px-4 py-3 rounded-xl">Continue anyway</button>
    </div>
</div>
<script>
    (function () {
        try { if (sessionStorage.getItem('ufd.gate') === 'dismissed') document.documentElement.classList.add('gate-dismissed'); } catch (e) { /* storage blocked */ }
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('gateContinue').addEventListener('click', function () {
                document.documentElement.classList.add('gate-dismissed');
                try { sessionStorage.setItem('ufd.gate', 'dismissed'); } catch (e) { /* ignore */ }
            });
        });
    })();
</script>
