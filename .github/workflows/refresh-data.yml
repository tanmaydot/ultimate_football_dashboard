name: Refresh Premier League data

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 04:00 IST, every day (GitHub may start it a few minutes late)
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ufd/requirements.txt

      - run: pip install -r ufd/requirements.txt

      - name: "Build the data (a few minutes, the APIs are rate limited)"
        env:
          APIFOOTBALL_API_KEY: ${{ secrets.APIFOOTBALL_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALLDATA_IO_API_KEY: ${{ secrets.FOOTBALLDATA_IO_API_KEY }}
        run: python ufd/manage.py build_pl_data

      - name: Commit the new data (the push makes Render redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufd/ufd_app/data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh Premier League data ($(date -u +%F))"
            git push
          fi
