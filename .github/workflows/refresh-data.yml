name: Refresh Premier League data

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 04:00 IST, every day (GitHub may start it a few minutes late)
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: "Build the data (a few minutes, the APIs are rate limited)"
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          FOOTBALLDATA_IO_API_KEY: ${{ secrets.FOOTBALLDATA_IO_API_KEY }}
        run: python ufd/manage.py build_pl_data

      - name: "Check the data files are sound (a broken file must never be committed)"
        run: python ufd/manage.py check_data

      - uses: ./.github/actions/commit-data
        with:
          paths: ufd/ufd_app/data/
          message: Refresh Premier League data
