name: Refresh club extras (stadium + honours)

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *"   # 00:00 UTC on 1 Jan / Apr / Jul / Oct = 05:30 IST on the first day of each quarter
  workflow_dispatch:         # press "Run workflow" by hand, e.g. right after a cup final

permissions:
  contents: write

concurrency:
  group: refresh-club-extras
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: "Fetch stadium + honours (Transfermarkt API and Wikidata, no API keys needed)"
        run: python ufd/manage.py refresh_club_extras

      - uses: ./.github/actions/commit-data
        with:
          paths: ufd/ufd_app/data/club_extras.auto.json
          message: Refresh club extras
